version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always  # <--- Adicione isso
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: always  # <--- Adicione isso
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8050:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
    restart: always  # <--- Adicione isso
    ports:
      - "8051:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume: